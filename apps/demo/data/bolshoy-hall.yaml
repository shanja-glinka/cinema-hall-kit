# Cinema Hall Config — Grand Hall: a wide curved screen, stalls in three sections, lounge rows behind
# them, and a real balcony on the upper level that hangs over the lounge rows.
# Units: metres, degrees. Colours: #RRGGBB.
version: 1
id: bolshoy-hall
name: Grand Hall
meta:
  hallType: LUX

hall:
  width: 18.0
  depth: 18.0
  height: 9.0
  wallColor: '#121316'
  floorColor: '#1A1B1E'

screen:
  width: 14.0
  height: 5.2
  elevation: 0.9
  curvature: 0.3

seatTypes:
  standard:
    label: Classic
    width: 0.55
    depth: 0.60
    color: '#5E636B'
  recliner:
    label: Lounge (recliners)
    width: 0.60
    depth: 0.85
    color: '#B98A8A'
  balcony:
    label: Balcony
    width: 0.55
    depth: 0.60
    color: '#7C8A8F'

layout:
  firstRowDistance: 6.0
  rowLabels: alphabetic
  seatNumbering: continuous
  eyeHeight: 1.15
  bands:
    - id: stalls
      label: Stalls
      riserHeight: 0.3
      defaults:
        rows: 7
        rowSpacing: 0.95
        seatPitch: 0.60
        seatType: standard
      sections:
        - id: left
          seatsPerRow: 4
        - id: centre
          gapBefore: 1.0
          seatsPerRow: 10
        - id: right
          gapBefore: 1.0
          seatsPerRow: 4
    - id: lounge
      label: Lounge
      gapBefore: 1.2
      riserHeight: 0.4
      defaults:
        rows: 3
        rowSpacing: 1.3
        seatPitch: 0.70
        seatType: recliner
      sections:
        - id: lounge-left
          seatsPerRow: 4
        - id: lounge-centre
          gapBefore: 1.0
          seatsPerRow: 8
        - id: lounge-right
          gapBefore: 1.0
          seatsPerRow: 4
    - id: balcony
      label: Balcony
      # The balcony starts 13.5 m from the screen, above the lounge rows, with its floor 5.6 m up.
      startDistance: 13.5
      elevation: 5.6
      riserHeight: 0.6
      defaults:
        rows: 3
        rowSpacing: 0.95
        seatPitch: 0.60
        seatType: balcony
      sections:
        - id: balcony
          seatsPerRow: 18

pricing:
  tiers:
    standard: 450
    recliner: 780
    balcony: 380
