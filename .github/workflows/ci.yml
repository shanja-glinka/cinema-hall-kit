name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:publish
      - run: pnpm check:licenses
      - name: Check for Cyrillic text
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';

          const files = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' })
            .split('\0')
            .filter(Boolean);
          const cyrillic = /[\p{Script=Cyrillic}]/u;
          const matches = [];

          for (const file of files) {
            const bytes = readFileSync(file);
            if (bytes.includes(0)) continue;
            if (cyrillic.test(bytes.toString('utf8'))) matches.push(file);
          }

          if (matches.length > 0) {
            console.error(`Cyrillic text found in: ${matches.join(', ')}`);
            process.exit(1);
          }
          NODE
